body:
  text: 唐英歌詩卷上唐吳融撰奉和御製嶽寺清秋霽宸遊永日閒霓旌森物外鳳吹落人間玉潄穿城水屏開對闕山皆知聖情悅麗藻灑芳蘭和集賢相公西溪侍宴觀競渡片水聳層橋祥煙靄慶霄畫花鋪廣宴晴電閃飛橈浪叠搖仙仗風微定彩標都人同盛觀不覺在行朝山居即事四首桂樹秋來風滿枝碧巖歸日免乖期故人盡向蟾宫折獨我攀條欲寄誰不傲南窗且採樵乾松每帶濕雲燒庖厨却得長兼味三秀芝根五术苖萬事翛然只有棋小軒髙靜簟凉時闌珊半局和微醉花落中庭樹影移無鄰無里不成村水曲雲重掩石門何用深求避秦客吾家便是武陵源紅白牡丹不必繁絃不必歌靜中相對更情多殷鮮一半霞分綺潔徹旁邉月颭波看久願成莊叟夢惜留須倩魯陽戈重來應共今來别風墮殘香襯緑莎中秋十五夜陪熙用學士侍郎禁中玩月因書五言六韻月圓年十二秋半每多陰此夕無纎靄同君宿禁林未髙知海濶當午見宫深衣似繁霜透身疑積水沉遭逄陪侍輦歸去憶抽簮太液池南岸相期到曉吟題豪家故池歲久無泉引春來仰雨流萍乾粘巧檻沙淺露沉舟照影人何在持竿客寄遊翛然興廢外回首謝眠鷗偶題賤子曽塵國士知登門倒屣憶當時西川酌盡看花酒東閣編成詠雪詩莫道精靈無伯有尋聞任俠報爰絲烏衣舊宅猶能認粉竹金松一兩枝渚宫立春書懷春候侵殘臘江蕪緑巳齊風髙鶯囀澀雨密雁飛低向日心須在歸朝路欲迷近聞驚御火猶及灞陵西聞李翰林遊池上有寄花飛絮落水和流玉署詞臣奉詔遊四面看人隨畫鷁中流合樂起眠鷗皇恩自抱丹心報清頌誰將白雪酬不為禁鐘催入宿前峰月上未回舟谷口寓居偶題涔涔病體怯朝天谷口歸來取性眠峭壁削成開畫障清溪飛下咽繁絃不能塵土爭閒事且放神形學散仙巳熟前峰採芝徑更於何處養殘年無題萬態千端一瞬中沁園蕪沒佇秋風鵁鶄夜警池塘冷蝙蝠晝飛樓閣空粉貌早聞殘洛市簫聲猶自傍秦宫今朝陌上相非者曽此歌鐘幾醉同賦雪一夜陰風度平明皓氣交未知融結判唯見混茫包路莫藏行跡林難出樹梢氣應封獸穴險必墮禽巢影密燈回照聲繁竹送敲玩宜酥讓㸃食稱蜜同抄凍結防魚轉粘沙費馬跑爐寒資爇荻屋暖賴編茅逺不分山疊低宜失地坳闌干髙百尺新霽若為拋寄僧桞拂池光一樣清紫方袍帶杖藜行偶傳新句來中禁誰把閒書寄上卿門倚山根重蘚破碁敲石面碎雲生應憐正視淮王詔不識東林物外情酬僧吾師既續惠休才况值髙秋萬象開吟處逺峰橫落照定中黃葉下青苔雙林不見金蘭久丹楚空翻組繡來聞說近郊寒尚緑登臨應待一叨陪題延夀坊東南角古池蔓草蕭森曲岸摧水籠沙淺露莓苔更無簇簇紅粧㸃猶有雙雙翠羽來雨細幾逄耕犢去日斜時見釣人回繁華自古皆相似金谷荒園土一堆登鸛雀樓鳥在林梢腳底看夕陽無際戍烟殘凍開河水奔渾急雪洗條山錯落寒始為一名拋故國近因多難怕長安祖鞭掉折徒為爾贏得雲溪負釣竿和峽州馮使君題所居三年拔薤成仁政一日誅茅葺所居曉岫近排吟閣冷夜江遙響寢堂虛唯懷避地逃多難不羡朝天卧直廬記得街西鄰舍否投荒南去五千餘秋日感懷一葉飄然夕照沉世間何事不經心幾人欲話雲臺峻獨我方探禹穴深雞檄固應無下䇿鶴書還要問中林自憐情為多憂動不為西風白露吟鶯月落林西鳥未知自先飛上最髙枝千啼萬語不離恨已去又來如有期慣識江南春草處常驚薊北夢回時謝家園裏成吟久只缺池塘一句詩次韻和王員外雜遊一分難减亦難加得似溪頭浣越紗兩槳慣邀催去艇七香曾占取來車黃昏忽墮當樓月清曉休開滿鏡花誰見玉郎腸斷處露牀風簟半欹斜秋事江天暑氣自凉清應候須因一雨成松竹健來惟缺語蕙蘭衰去始多情他年擬獻書空在此日知機意盡平更欲輕橈放烟水葦花深處睡秋聲和陸拾遺題諫院松落落孤松何處尋月華西畔結根深曉含仙掌三清露晚上宫牆百雉陰野鶴不歸應有怨白雲髙去太無心碧巖秋澗休相望捧日元須在禁林題揚子津亭揚子江津十四經幾行文字遍長亭驚人旅鬢斬新白無事海門依舊青前路莫知霜凛凛故鄉何處鴈冥冥可憐不識生離者數㸃漁舟落暮汀閒望三㸃五㸃映山雨一枝兩枝臨水花蛺蝶狂飛掠芳草鴛鴦熟睡翹暖沙闕下新居非故業江南舊隱是誰家東還西去俱無計却羡暝歸林上鴉雪後過昭應路過章臺氣象寬九重城闕在雲端烟含上苑沉沉紫雪露南山悚悚寒綺陌巳堪馳寶馬緑蕪行即墮金丸灞川南北真圖畫更待殘陽一望看商人百尺竿頭五兩斜此生何處不為家北拋衡嶽南過鴈朝發襄陽暮看花蹭蹬也應無陸地團圓那覺有天涯隨風逐浪年年别却笑如期八月槎岐下聞杜鵑化去蠻鄉北飛來渭水西為多亡國恨不忍故山啼怨已驚秦鳳靈應識漢雞數聲烟漠漠餘思草萋萋樓逈波無際林昏日又低如何不腸斷家近五雲溪雨夜聞思歸樂二首山禽連夜呌兼雨未嘗休解道思歸樂應多離别愁我家方旅食故國在滄洲聞此不能寐青燈茅舍幽一夜鎮飛鳴間關徹五更似因歸路隔長使别魂驚未省愁雨暗就中傷月明須知越吟客欹枕不勝情中夜聞啼禽漠漠蒼蒼未五更宿禽何處兩三聲若非西澗回波觸即是南塘急雨驚金屋獨眠堪寄恨商陵永訣更牽情此時歸夢隨腸斷半壁殘缸閃閃明靈池縣見早梅時太尉中書令京兆公奉詔討蜀余在幕中小園晴日見寒梅一寸鄉心萬里回春日遲時拋笠澤戰塵飛處上琴臺棲身未識登龍地落筆元非倚馬才待勒燕然歸未得雪枝南畔少徘徊野廟古原荒廟掩莓苔何處喧喧鼓笛來日暮鳥歸人散盡野風吹起紙錢灰閒書接鷺陪鸞漫得羣未如髙卧紫溪雲晉陽起跡尋常說湖口屯營取次聞大抵鷦鵬須自適何嘗玉石不同焚回看帶礪山河者到得危時沒舊勳寄貫休上人别來如夢亦如雲八字微言不復聞世上浮沉應念我筆端飛動只降君幾同江步吟秋霽更憶山房語夜分見擬沃州尋舊約且教丹頂許為鄰書懷傍巖依樹結簷楹夏物蕭疏景更清灘響忽髙何處雨松隂自轉此山晴見多鄰犬遙相認來慣幽禽近不驚爭敢便誇饒勝事九衢塵裡免勞生重陽日荆州作萬里投荒巳自哀髙秋寓目更徘徊濁醪任冷難辭醉黃菊因喧却未開南國莫歸戎馬亂故人何在塞鴻來驚時感事俱無奈不待殘陽下楚臺松江晚泊樹逺天宜盡江奔地欲隨孤帆落何處殘日更新離客是凄凉本情為繫滯枝寸腸無計免應只楚猿知湖州溪樓書獻鄭員外危檻等飛牆閒追晚際凉青林上雨色白鳥破溪光目以髙須極心因靜更傷唯公舊相許早晚侍長楊秋興微雨過菰葦野居生早凉襟期漸蕭灑精爽欲飛揚魚買罾頭活酒沽船上香不緣人不用始道靜勝忙端居片雨度前汀端居枕簟清病根隨暑退詩思傍涼生别燕殷勤語殘蟬髣佛鳴古來悲不盡况我本多情途中一棹歸何處蒼茫落照昏無人應失路有樹始知村湖岸春耕廢江城戰鼓喧儒冠久相誤學劒盡乘軒寄貫休休公何處在知我宦情無巳似馮唐老方知武子愚一身仍更病雙闕又須趨若得重相見冥心學半銖秋日渚宫即事漠漠淡雲煙秋歸澤國天風髙還促燕雨細未妨蟬靜引荒城望凉驚旅枕眠更堪憔悴裡欲泛洞庭船荆州偶居書懷一室四無鄰荒郊接古津幽閒消俗態搖落露家貧絶跡思浮海修書懶寄秦東西不復問翻笑泣岐人和嚴諫議題簫山廟十韻舊說常聞簫管聲因而得名次韻澤國瞻遺廟雲韶仰舊名一隅連嶂影千仞落泉聲老狖尋危棟秋蛇束畫楹路長資稅駕歲儉絶豐盛默默雖難測昭昭本至平豈知遷去客自有復來兵美舜歌徒作欺堯犬正獰近兼聞順動敢復怨徂征日出天須霽風休海自清肺腸無處說一為啓聰明西陵一本多夜居二字寒潮落逺汀暝色入柴扄漏永沉沉靜燈明的的青林風移宿鳥池雨定流螢盡夕成愁絶啼螀莫近庭燕雛掠水身猶重隈風夕尚微瓦苔難定立簷雨忽喧歸未識重溟逺先愁一葉飛銜泥在他日兩兩占春暉新秋白髮又經秋端居海上洲無機因事發有涕為時流新酒乘凉壓殘棋隔夜收公車無路入同拜老閒侯題越州法華寺寺映一作在五峰隂穿緣一徑尋雲藏古殿暗石護小房深宿鳥連僧定寒猿應客吟上方應見海月出試登臨寒食洛陽道路岐無樂處時節倍思家綵索揚輕吹黃鸝啼落花連乾馳寶馬歷祿鬪香車行客勝回首看看春日斜憶事去年花下把金巵曾賦楊花數句詩回首朱門閉荒草如今愁到牡丹時金陵遇悟空上人上人與故相國楊公有舊東閣無人事渺茫老僧持鉢過丹陽十年棲止如何報好為南譙剩炷香途中桞弱風長在雲輕雨易休不勞芳草色更惹夕陽愁萬里獨歸去五陵無與遊春心漸傷盡何處有髙樓秋園始憐春草細霏霏不覺秋來緑漸稀惆悵擷芳人散盡滿園烟露蝶髙飛富春天下有水亦有山富春山水非人寰長川不是春來緑千峰倒影落其間山居即事小亭前面接清崖白石交加襯緑苔日暮松花滿階砌不關風雨鶴歸來寓言非明非暗朧朧月不暖不寒縵縵風獨卧空牀好天氣平生閒事到心中華清宫二首四郊飛雪暗雲端唯此宫中落旋乾緑樹碧簷相掩映無人知道外邉寒長生祕殿倚青蒼擬敵金庭不死鄉無奈逝川東去急秦陵松柏滿殘陽過九成宫鳳輦東歸二百年九成宫殿半荒阡魏公碑字封蒼蘚魏文貞徵有碑文帝泉聲落野田太宗行幸有靈泉自湧碧草斷霑仙掌露緑楊猶憶御爐烟升平舊事無人說萬疊青山但一川出潼關重門隨地險一徑入天開華嶽眼前盡黃河腳底來飛軒何滿路丹陛正求才獨我無稽客飄然又此回過丹陽雲陽縣郭半郊坰風物蕭條萬古情山帶梁朝陵路斷水連劉尹宅基平桂枝自折思前代李考功於此知貢舉藻鑑難逄恥後生殷文學於此集英靈遺事滿懷兼滿目不堪孤棹倚荒城和人題武城寺神驚已覺三清近目斷仍勞萬象牽渭水逺含秋草渡漢陵髙枕夕陽天半巖雲粉千竿竹滿寺風雷百尺泉别有闌干壓行路看人塵土竟流年長安里中聞猿夾巷重門似海深楚猿爭得此中吟一聲紫陌才回首萬里青山已到心慣倚客船和雨聼可堪侯第見塵侵無因永夜聞清嘯禁路人歸月自沉岐下聞子規劒閣西南逺鳳臺蜀魂何事此飛來偶因隴樹相迷至唯恐邉風却送回自有花知啼血處更無猿替斷腸哀誰憐越客曾聞處月落江平曉霧開敷水有丐者云是馬侍中諸孫憫而有贈天地塵昏九鼎危大貂曾出武侯師一心忠赤山河見百戰功名日月知舊宅已聞栽禁樹即今奉誠園諸孫仍見丐征岐而今不要教人識正藉將軍死鬪時還俗尼本是歌妓桞睂梅額倩粧新笑脫袈裟得舊身三峽却為行雨客九天曾是散花人空門付與悠悠夢寶帳迎回暗暗春寄語江南徐孝克一生長短託清塵彭門用兵後經汴路三首長亭一望一徘徊千里關河百戰來細桞舊營猶鎖月祈連新冢巳封苔霜凋緑野愁無際燒接黃雲慘不開若比江南更牢落子山詞賦莫興哀隋隄風物已凄凉堤下仍多舊戰場金鏃有苔人拾得蘆花無主鳥銜將秋聲暗促河聲急野色遙連日色黃獨上寒城正愁絶戍鼙驚起鴈行行鐡馬雲旗夢渺茫冬來無處不堪傷風吹白草人行少月落空城鬼嘯長尚有一作一自紛爭驚宇宙可憐蕭索絶煙光曾為塞北閒遊客遼水天山未斷腸寄殿院髙侍御黃梅雨細羃長洲桞密花稀水慢流釣艇正尋逋客去繡衣方結少年遊風前不肯看垂手燈下還應誤㸃頭一夜自憐無羽翼獨當何遜滴階愁新安道中玩流水一渠春碧弄潺潺密竹繁花掩映間看處便須終日住算來爭得此身閒縈紆似接迷春洞清冷應憐有雪山上却征車更回首了然塵土不相關憶釣舟青山卜一作小隱枕潺湲一葉垂綸幾泝沿後浦春風隨興去南塘秋雨有時眠慣衝曉霧驚羣雁愛颭殘陽入亂煙回首無人寄惆悵九衢塵土困揚鞭靈寶縣西側律縣一本題作靈寶西側津碧溪㶑㶑流殘陽晴沙兩兩眠鴛鴦桞花無賴苦多暇蛺蝶有情長自忙千里宦遊成底事每年風景是他鄉髙歌一曲垂鞭去盡日無人識楚狂即席家住叢臺舊名參絳圃新醉波疑奪燭嬌態欲沉春伴雨聊過楚歸雲定占秦桃花正濃暖爭不浪迷人出遲園密花藏易樓深月到難酒虛留客盡燈暗速更殘麝想眉間印鴉知頂上盤文王之囿小莫惜借人看送僧歸日本國滄溟分故國渺渺泛杯歸天盡終期到人生此别稀無風亦駭浪未午巳斜暉繫帛何須鴈金烏日日飛夏夜有寄月上簟如水軒髙簾在鈎竹聲寒不夏蛩思靜先秋偶得青霄興方知白日愁所思何處遠斜漢欲低流春詞鸞鏡長侵夜鴛衾不識寒羞多轉面語妬極定睛看金市舊居近鈿車新造寬春期莫相誤一日百花殘送僧歸破山寺萬里指吳山髙秋杖錫還别來雙闕老歸去片雲閒師在有無外我嬰塵土間居然本相别不要慘離顔汴上晚泊亭上風猶急橋邉月巳斜桞寒難吐絮浪濁不成花岐路春三月園林海一涯蕭然正無寐夜櫓莫咿啞送僧南遊戰鞞鳴未已瓶屨抵何鄉偶别塵中易貪歸物外忙後蟬拋鄠杜先鴈下瀟湘不得從師去殷勤謝草堂戲恨極同填海情長抵導江丁香從小結蓮子徹枝雙整髻花迎一作當檻吹燈月在窗秦臺非久計早晚降霓幢雪中寄盧延讓秀才苦貧皆共雪吾子豈同悲一作兹永日應無食經宵必有詩渚宫寒過節華省試臨期努力圖西去休將凍餒辭花村六韻地勝非離郭花深故號村巳憐梁雪重仍愧楚雲繁山近當吟冷泉髙入夢喧依稀小有洞邂逅武陵源月好頻移座風輕莫閉門流鶯更多思百囀待黃昏賦雪十韻雨凍輕輕下風乾淅淅吹喜勝花發處驚似客來時河靜膠行棹嵓空響折枝終無鷓鴣識先有鶺鴒知馬勢晨爭急雕聲晚更飢替霜嚴柏署藏月上龍墀百尺樓堪倚千錢酒要追朝歸紫閣早漏出建章遲臘候一作後何曾爽春工是所資遙知故溪桞排比萬條絲溪邉溪邉花滿枝百鳥帶香飛下有一白鷺日斜翹石磯長安逄故人歲暮長安客相逄酒一杯眼前閒事盡一作靜心裏故山來池影含新草林芳動早梅如何不歸去霜鬢共風埃雨夜旅夕那禁雨梅天巳思秋未明孤枕倦相弔一燈愁有戀慙滄海無機奈白頭何人得濃睡溪上釣漁舟旅中送遷客天南不可去君去弔靈均落日青山路秋風白髮人言危無繼者道在有明神滿目盡秦越平生何處陳寄尚顔師僧中難得靜靜得是吾師到闕不求紫歸山祗愛詩臨風翹雪足向日剃霜髭自歎眠漳水雙林動所思微雨天青濕一作織未遍風急舞難成粉重低飛蝶黃沉不語鶯自隨春靄亂還放夕陽明惆悵池塘上荷珠㸃㸃傾送廣利大師東歸紫殿久霑恩東歸過海門浮榮知是夢輕别肯銷魂明發先晨鳥寒棲入暝猿蕺山如重到應老舊雲根大師善於草聖故云關東獻兵部劉員外昨夜星辰動仙郎近漢關玳筵吟雪罷錦帳押春還巳到青雲上應棲絳圃間臨卭有辭賦一為奏天顔塗次淮口寒流萬𣲖碧南渡見煙光人向隋宫近山盤楚塞長有村皆緑暗無徑不紅芳已帶傷春病如何更異鄉詠桞自與鶯為地不教花作媒細應和雨斷輕祗愛風裁好拂錦步障莫遮銅雀臺灞陵千萬樹日暮别離回武牢關遇雨深一作澤春關路逈暮雨細霏霏帶霧昏河浪和塵重客衣望中迷去騎愁裏亂斜暉惆悵家山逺溟濛濕翠微春寒固教梅忍落休與杏藏嬌巳過冬疑剩將來暖未饒玉階殘雪在羅薦暗魂銷莫問王孫事煙蕪正寂寥早發潼關天邉月初落馬上夢猶殘關樹蒼蒼曉天階淡淡寒宦遊終自苦身世靜堪觀爭似山中隱和雲枕碧湍送䇿上人昨來非有意今去亦無心闕下拋新院江南指舊林瓶添新澗緑笠卸晚峰隂八字如相許終辭尺組尋和諸學士秋夕禁直偶雪太華積秋雪禁闈生夜寒硯氷憂詔急燈燼惜更殘正遂攀嵇願翻追訪戴歡更為三日約髙興未將䦨御溝十六韻一水終南下何年𣲖作溝穿城初北注過苑却東流繞岸清波溢連宫瑞氣浮去應涵鳳沼來必滲龍湫激石珠爭碎縈堤練不收照花長樂曙泛葉建章秋影炫金莖表光搖綺陌頭旁沾畫睂府斜入教簫樓有雨難澄鏡無萍易擲鈎鼓宜堯女瑟蕩必蔡姬舟臯的一作著通鳴鶴津應接斗牛逗風還㶑㶑和月更悠悠淺憶觴堪泛深思杖可投祗懷涇合慮不帶隴分愁自有朝宗樂曾無潰穴憂不勞誇大漢清渭貫神州赴闕次留獻荆南成相公三十韻分閫兼文德持衡有武功荆南知獨去海內更誰同拔地孤峰秀當天一鶚雄雲生五色筆月吐六鈞弓骨格凌秋聳心源見底空神清餐瀣沆氣逸飲洪濛臨事成奇䇿全身仗至忠解鞍欺李廣煮弩笑臧洪往昔逄多難來茲故統戎卓旗雲夢澤撲火細腰宫鏟土樓臺搆連江雉堞籠似平鋪掌上疑湧出壺中豈是勞人力寧因役鬼工本遺三户在今匝萬家通畫舸橫青雀危檣列綵虹席飛巫峽雨袖拂宋亭風場廣盤毬子池開引釣筒禮賢金璧賤煦物雪霜融酒滿梁塵動棊殘漏滴終儉常資淡靜貴絶恃穹崇唯要臣誠顯那求帝渥隆甘棠名異奭大樹姓非馮自念為遷客方諧謁上公痛知遭止棘頻嘆委飄蓬借宅誅茅緑分囷指粟紅只慙燕館盛寧覺阮途窮渙汗沾明主滄浪别釣翁去曾憂塞馬歸欲逐邉鴻積感深於海銜恩重極嵩行行桞門路回首下離東三峰府內矮檜十韻擢秀依黃閣移根自碧岑周圍雖合抱直上豈盈尋逺砌行窺頂當庭坐芘隂短堪驚衆目髙已讓他林日轉無長影風回有細音不容蘿蔦附只耐雪霜侵玉帳籠應匝牙旗倚更禁葉低宜拂席枝裊易抽簮緑澗支離久朱門掩映深何須一千丈方有歲寒心雪十韻灑密蔽璇穹霏霏杳莫窮遲於雨到地疾甚絮隨風四野蒼茫際千家晃朗中夜迷三繞鵲晝斷一行鴻結片飛瓊樹裁花照蕊宫壅應邉盡北填合海無東髙愛危峰積低愁暖氣融月交都浩渺日射更玲瓏送臘辭寒律迎春入舊叢自憐曾未至聊復賦𤣥功和睦州盧中丞題茅堂十韻有士當今重忘情自古稀獨開青嶂路閒掩白雲飛石纍千層險泉分一帶微棟危猿競下簷逈鳥爭歸煙冷茶鐺靜波香蘭舸飛好移鐘阜蓼莫種首陽薇樹密含輕霧川空漾薄暉芝泥看即捧蕙帶且休圍東郭鄰穿履西林近衲衣瓊瑶一百字千古見清機奉和御製六韻天曉密雲開亭亭翠葆來芰荷籠水殿楊桞蔽風臺恩洽三時雨歡騰萬嵗雷日華偏照御星彩逈分台葦岸縈仙棹蓮峰倒玉杯獨慙歌聖德不是侍臣才敗簾六韻有客編來久彌年斷莫收不堪風作候豈復燕為讎盡見三重閣難迷百尺樓伴燈微掩夢兼扇劣遮羞零落亡珠綴殷勤謝玉鈎凉宵何必捲月自入軒流玉堂種竹六韻當砌植檀欒濃隂五月寒引風穿玉牖搖露滴金盤有韻和宫漏無香雜畹蘭地嚴雲鎖易日近雪封難靜稱圍棊㑹閒宜閣筆看他年終結實不羡樹棲鸞和韓致光侍郎無題三首十四韻珠珮元消暑犀簮自辟塵掩燈容燕宿開鏡待雞晨去懶都忘舊來多未厭新每逄憂是夢長憶故延真杏小雙圓靨山濃兩㸃顰瘦難勝寶帶輕欲馭飇輪箆鳳金雕翼叉魚玉鏤鱗月明無睡夜花落斷腸春解舞何須楚能筝可在秦怯探同海底稀遇極天津緑捺攀宫艷青梅弄嶺珍管纎銀字咽梭密錦書勻厭勝還隨俗無疑不避人可憐三五夕嫵媚善為鄰舞轉輕輕雪歌霏漠漠塵漫遊多入一作卜夜慵起不知晨玉筯和粧裛金蓮逐步新鳳笙追北里鶴馭訪南真有恨都無語非愁亦有顰戲應過蚌浦飛合入蟾輪杯樣成言鳥梳文解卧鱗逄迎大隄晚離别洞庭春似玉曾誇趙如雲不讓秦錦收花上露珠引月中津木為連枝貴禽因比翼珍萬峰蘇㸃薄五色繡粧勻獺髓求魚客鮫綃託海人寸腸誰與達洞府四無鄰綺閣臨初日銅臺拂暗塵鷾鴯偏報曉烏鶂慣驚晨魚網裁書數鵾弦上曲新病多疑厄重語切見心真子母錢徵笑西南月借顰搗衣嫌獨杵分袂怨雙輪貝葉教丹嘴金刀寄赤鱗捲簾吟塞雪飛楫渡江春解織宜名蕙能歌合姓秦眼穿回鴈嶺魂斷飲牛津藥自偷來絶香從竊去珍茗煎雲沫聚藥種玉苖勻草密應迷客花繁好避人長干足風雨遙夜與誰鄰唐英歌詩卷上
