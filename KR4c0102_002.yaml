body:
  text: 唐英歌詩卷中唐吳融撰倒次元韻南陌來尋伴東城去卜鄰生憎無賴客死憶有情人似束腰支細如描髮彩勻黃鸝裁帽貴紫燕刻叉珍身近從淄右家元接觀津雨臺誰屬楚花洞不知秦淚滴空牀冷粧濃滿鏡春枕凉欹琥珀簟潔展麒麟茂苑廊千步昭陽扇九輪陽城迷處笑京兆畫時顰魚子封箋短蠅頭學字真易判期已逺難諱事還新艇子愁衝夜驪駒怕拂晨如何斷岐路免得見行塵美人三十韻人一作箇嫋嫋復盈盈何年墜玉京見人還道姓羞客不稱名故事諳金谷新居近石城臉橫秋水溢睂拂逺山晴粉薄塗雲母簮寒篸水晶催來兩槳送怕起五絲縈髻學盤桓綰牀依宛轉成博山凝霧重油壁隱車輕額㸃梅花樣心通棘刺情搔頭邀顧遇指約到平生魚網徐徐襞螺巵淺淺傾芙蓉褥已展豆蔻水休更趙女憐膠膩丁娘愛燭明炷香龍薦腦辟魘虎輸精管咽參差韻絃嘈倰僜聲花殘春寂寂月落漏丁丁桞絮聫章敏椒花屬思清剪羅成綵字銷蠟脫朱櫻邂逅當投珮艱難莫拊楹尉來身熱定䑛得面痕平匣鏡金螭怒簾旌繡獸獰頸長堪鶴並腰細任蜂爭滴淚泉饒竭論心石未貞必雙成鳳去豈獨化蟬鳴書逺腸空斷樓髙膽易驚數錢紅帶結鬭草舊裙盛映桞闌干小侵波略彴橫夜愁遙寄雁曉夢半和鶯翼祗思鶼比根長羡藕并可憐衣帶緩休賦重行行即席十韻住處方窺宋平生未嫁盧暖金輕鑄骨寒玉細凝膚妬蝶長成伴傷鸞耐得孤城堪迷下蔡臺合上姑蘇弄眼難降桞含茸欲門蒲生凉雲母扇直夜博山爐翡翠交粧鏡鴛鴦入畫圖無心同石轉有淚約泉枯猿渴應須見鷹飢祗待呼銀河正清淺霓節過來無追詠棠梨花十韻蜀地從來勝棠梨第一花更應無軟弱别自有妍華不貴綃為霧難降綺作霞移須歸紫府駐合餌丹砂密映彈琴宅深藏賣酒家夜宜紅䗶照春稱錦筵遮連廟魂棲望飄江字繞巴未饒酥㸃薄兼妬雪飛斜舊賞三年斷新期萬里賒長安如種得誰定牡丹誇綿竹山四十韻綿竹東西隅千峰勢相屬崚嶒壓東巴連延羅古蜀方者露圭角尖者鑽箭鏃引者蛾睂彎斂者鳶肩縮尾蟉青蛇盤頸低𤣥兔伏橫來突若奔直上森如束歲在作噩年銅梁搖蠆毒相國京兆公九命來作牧戎提虎僕毛專奉狼頭纛行府寄精廬開窗對林麓是時重陽後天氣曠清肅茲山昏曉開一一在人目霜空正泬寥濃翠飛撲撲披海出珊瑚貼天堆碧玉俄然陰霾作城郭才霡霂絶頂已凝雪晃朗開紅旭初疑崑崙下夭矯龍銜燭亦似蓬萊巔金銀臺叠蹙紫霞或旁映綺段鋪繁縟晚照忽斜籠赤城差斷續又如煮吳鹽萬萬盆初熟又如濯楚練千千匹未軸又如水晶宫蛟螭結川瀆又如鍾乳洞電灼開巖谷丹青畫不成造化供難足合有羽衣人飄颻曳煙躅合有五色禽呌嘯含仙曲根雖限劒門穴必通林屋方諸滄海隔欲去憂淪覆羣玉縹眇間未可量往復何如當此境終朝曠遐矚往往草檄餘吟哦思幽獨早晚掃攙搶笳鼓迎暢轂休飛霹靂車罷繫蝦蟇木勒銘燕然山萬代垂芬郁然後恣逍遙獨往羣麋鹿不管安與危不問榮與辱但樂濠梁魚豈怨鍾山鵠紉蕙以圍腰採芝將實腹石牀須卧平一任閒雲觸祝風三十二韻吾有田在吳將十祀耕以為業終老計我有二頃田長洲東百里環塗為之區積葑相連纚松江流其傍春夏多苦水隄防苟不時泛濫即無已粵余病眠久而復家無峙田畯不勝荒農功皆廢弛他稼巳如雲我田方欲蒔四際上通波兼之葭與葦是時立秋後烟露浩凄矣雖然遣畢功萎約都無幾如何海上風連日從空起似欲驅滄溟來沃具區裏噫嘻爾風師吳中多豪士囷倉過九年一粒惜如死糴賤兼糶貴凶年翻大喜只是疲羸苦才饑須易子余仍轗軻者進趨年二紀秋不安一食春不閒一晷腸回為多别骨瘦因積毁咳唾莫逄人揶揄空覩鬼中又值干戈皇皇常轉徙故隱茅山西今來笠澤涘荒者不復尋茸者還有以將巾陶令車又蓋姜肱被不敢務有餘有餘必驕鄙所期免假丐假丐多慙恥驕鄙既不生慙恥更能弭自可致逍遙無妨閲經史嗟豫將四十滿望祗如此干澤尚多難學稼茲復爾窮達雖繫命祻福生所履天不飢死余飄風當自止金陵懷古玉樹聲沉戰艦收萬家冠蓋入中州祗應江令偏惆悵頭白歸來是客遊凉思松間小檻接波平月淡煙沉暑氣清半夜水禽栖不定緑荷風動露珠傾鮫綃雲供片段月供光貧女寒機枉自忙莫道不蠶能致此海邉何事有扶桑潮暮去朝來無定期桑田長被此聲移蓬萊若探人間事一日還應兩度知忘憂花繁紅落盡始凄凉直道忘憂也未忘數朵殷勤似春在春愁特此繫人腸憶街西所居衡門一别夢難稀人欲歸時不得歸長憶去年寒食夜杏花零落雨霏霏雲南北東西似客身逺峰髙鳥自為鄰清歌一曲猶能住莫道無心勝得人華清宫四首中原無鹿海無波鳳輦鸞旗出幸多今日故宫歸寂寞太平功業在山河漁陽烽火照函關玉輦匆匆下此山一曲羽衣聽不盡至今遺恨水潺潺上皇鑾輅重巡遊雨淚無言獨倚樓惆悵眼前多少事落花明月滿宫秋别殿和雲鎖翠微太真遺像夢依依玉皇掩淚頻惆悵應嘆僧繇白鶴一作彩筆飛陳琳墓冀州飛檄傲英雄却把文辭事鄴宫從道筆端由我得九泉何面見袁公湖州朝陽樓十二亭亭占曉光隋家浪說有迷藏仲宣題盡平生恨别處應難看屋梁賣花肩和煙和露一叢花擔入宫城許史家惆悵街頭一作東風無處說不教閒地著看一作春花自諷世路升沉合自安故人何必苦相干塗窮始解東歸去莫過嚴光七里灘送杜鵑花春紅始盡一作謝又秋紅故一作息國亡來入楚宫應是蜀寃啼不盡更憑顔色訴西風西京道中聞蛙雨餘林外夕烟沉忽有蛙聲伴客吟莫道聞時倍惆悵稚圭蓬蓽在山隂情依依脉脉兩如何細似輕絲渺似波月不長圓花易落一生惆悵為伊多送荆南從事之嶽州秋拂湖光一鏡開庾郎蘭棹好徘徊遙知月落酒醒處五十絃從波一作枝上來渡淮作紅杏花時辭漢苑黃梅雨裏上淮船雨迎花送長如此辜負東風十四年薛舍人見徵恩賜香并二十八字同寄往嵗知君侍武皇今來何用紫羅囊都緣有意重熏裛更灑江毫上玉堂一作皇王母廟鸞龍一夜降崑丘遺廟千年枕碧流賺得武皇心力盡忍看烟草茂陵秋塗中阻風洛陽寒食苦多風掃蕩春華一半空莫道芳蹊盡成實野花猶有未開叢楚事屈原云目極千里傷春心宋玉云悲哉秋之為氣悲秋應亦抵傷春屈宋當年並楚臣何事從來好時節只將惆悵付詞人和僧詠牡丹萬緣銷盡本無心何事看花恨却深都是支郎足情調墜香殘蘂亦成吟豫讓韓魏同謀反覆深晋陽三板免成沉趙衰當面何須恨不把干將訪負心和寄座主尚書偶逄戎旅戰爭日豈是明時放逐人一作臣不用裁詩苦惆悵風雷看起卧龍身江行霞低水逺碧翻紅一棹無邉落照中說示北人應不愛錦遮泥健馬追風旅館梅花清香無以敵寒梅可愛他鄉獨看來為憶故溪千萬樹幾年辜負雪中開水鳥烟為行止水為家兩兩三三睡暖沙為謝離鸞兼别鵠如何禁得向天涯楊花不鬭穠華不占紅自飛晴野雪濛濛百花長恨風吹落唯有楊花獨愛風水調鑿河千里走黃沙浮殿西來動日華可道新聲是亡國且貪惆悵後庭花秋夕樓居月裏青山淡如畫露中黃葉颯然秋危欄倚遍都無寐祗恐星河墜入樓經苻堅墓百里烟塵散杳冥新平一隰草青青八公山木一作石君知否休更中原作彗星松江晚泊吳臺越嶠兩分津萬萬檣烏簇夜雲吟盡長江一江月更無人似謝將軍送薛學士赴任峽州二首負譴雖安不敢安叠猿聲裏獨之官莫將彩筆閒拋擲更待淮王詔草看片帆飛入峽雲深帶雨兼風動楚吟何似玉堂裁詔罷月斜鳷鵲漏沉沉送許校書故人言别倍依依病裏斑荆尚一作苦憶違明日桞亭門外路不知誰賦送將歸蛺蝶兩兩自依依南園烟露微住時須並住飛處要交飛草淺憂驚吹花殘惜晚暉長教擷芳女夜夢逺人歸閿鄉寓居十首阿對泉六載抽毫侍禁闈可堪多病决然歸五陵年少如相問阿對泉頭一布衣阿對泉是楊伯起家僮嘗引泉灌蔬其泉至今尚在蛙聲稚圭倫鑒未精通只把蛙聲鼓吹同君聽月明人靜夜肻饒天籟與松風茆堂結得茆檐瞰碧溪閒雲之外不同棲猶嫌未逺函關道正睡剛聞報曉雞清溪清溪見底露蒼苔密竹垂藤鎖不開應是仙家在深處愛流花片引人來釣竿曾拋釣渚入秦關今却持竿傍碧灘認得舊人一作溪兼舊意恰如羊祜識金環山僧石臼山頭有一僧朝無香積夜無燈近嫌俗客知踪跡擬向中方斷石層小徑礙竹妨花一徑幽攀援可到玉峰頭若教須作康莊好更有髙車駟馬憂聞提壺鳥早於批鵊巧於鶯故國春林足此聲今在天涯别秋一作館裏為君沽酒復何情木塔偶題西南古剎近芳林偶得髙秋試一吟無限黃花襯黃葉何須春月始傷心山禽碧嶂為家烟外棲銜紅啄翠入芳蹊可能知我心無定頻裊花枝拂面啼聞歌貫珠一夜奏纍纍盡是荀家舊教詞落盡梁塵腸不斷九原誰報小憐知一作一聲嬌柳小寒枝即席竹引絲隨裊翠樓滿筵驚動玉關秋何人借與丹青筆畫取當時八字愁便殿候對宣呼晝入蘂珠宫玉女窗扉薄霧籠得得一作待得華胥春夢覺半竿斜日下廂風南遷途中七首登七盤嶺二首才非賈傅亦遷官五月驅羸上七盤從此自知身計定不能回首望長安七盤嶺上一長號將謂青天鑒鬱陶近日青天都不鑒七盤應是未髙髙渡漢江初嘗鯿魚有作嘯父知幾先憶魚季鷹無事巳思鱸自慙初識查頭味正是棲棲哭阮途溪魚一作溪翁飯稻羮菰曉復昏碧灘聲裏長諸孫應嗟獨上涔陽客排比椒漿奠楚魂寄友人驚魂往往坐疑飄便好為文慰寂寥若待清湘葬魚了總然招得不堪招途中偶懷無路能酬國士恩短亭寂寂到黃昏回腸一寸危如線賴得商山未有猿訪貫休上人休公為我設蘭湯方便教人學洗腸自覺塵纓頓瀟灑南行不復問滄浪鴛鴦野翹紅頸覆金衣灘上雙雙去又歸長短死生無兩處可憐黃鵠愛分飛野步一曲兩曲澗邊草千枝萬枝村落花携笻深去不知處幾嘆山阿隔酒家酬僧玉堂全不恨常朝卧待重城宿霧消翻憶故山深雪裏滿爐枯柏帶烟燒買帶花櫻桃粉紅輕淺靚粧新和露和烟别近鄰萬一有情應有恨一年榮落兩家春海棠二首太尉園林兩樹春今畨禺太尉徐公興化亭子有海棠二林年年奔走探花人今來獨倚荆山看回首長安落戰塵雪綻霞鋪錦水頭占春顔色最風流若教更近天街種馬上多逢醉五侯送僧上峽歸東蜀巴字江流一棹回紫袈裟是禁中裁如從十二峰前過莫賦佳人殊未來杏花五言三韻春物競相妬杏花應最嬌紅輕欲愁殺粉薄似啼銷願作南華蝶翩翩繞此條草染亦不可成畫亦不可得萇𢎞未死時應無此顔色和楊侍郎目極家山逺身拘禁苑深煙霄慚暮齒麋鹿愧初心山居喜友人相訪秋雨空山夜非君不此來髙于剡溪雪一棹到門回逺山隱隱隔千里巍巍知幾重平時未能去夢斷一聲鐘江樹終日衝奔浪何年墜亂風謝公堪入詠目極在雲中薔薇萬卉春風度繁花夏景長館娃人盡醉西子始新粧梅雨渾開又密望中迷乳燕歸遲粉竹低撲地暗來飛野馬舞風斜去散醯雞初從滴瀝妨琴榭漸到潺湲繞藥畦少傍海邊飄泊處中庭自有兩犂泥登途懷友人日落野原秀雨餘雲物閒清時正愁絶髙處更登一作躋攀京洛遙天外江河戰鼓間孤懷欲誰寄應向一作付塞鴻還聞蟬夏在先催過秋賖已被迎自應人不㑹莫道物無情木葉總未落鬢絲還易生西風正相亂休上夕陽城秋色染不成乾書未銷霏霏拂拂又迢迢曽從建業城邊路蔓草寒烟鎖六朝自諷本自滄洲把釣人無端三署接清塵從來奔走徒流涕也渡湘灕作逐臣宿青雲驛蒼黃負讉走商顔保得微躬出武關今夜青雲驛前月伴吟應到落西山秋聞子規年年春恨化寃魂血染枝紅壓疊繁正是西風花落盡不知何處認啼痕荆南席上聞歌迎愁斂黛一聲分弔屈江邊日暮聞何事遏雲翻不定自緣踪跡愛行雲唐英歌詩卷中
