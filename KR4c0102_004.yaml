body:
  text: 唐英歌詩跋吳子華越州人與韓偓同學久困名場龍紀元年同舉進士又同直玉堂故韓詩云二紀計偕勞筆研一朝宣入掌絲綸落句云語餘相聚却酸辛懷昔敘懇感慨係之矣歷官始末詳見本傳隴右李巨川才甚敏儕輩惟子華對壘一日昭宗至華清宫賜華帥韓建御容一軸時巨川為建掌書記草謝表示子華中有彤雲似蓋以長隨紫氣臨關而不度之句子華讀罷立成一篇其略曰霧開五里容諧披睹之心掌拔一峯兼助捧持之力巨川賞歎不巳壬戌卜居閿鄉與貫休上人結方外交互多酬寄琴川毛晉識集中有送僧歸破山寺云萬里指吳山高秋杖錫還别來雙闕老歸去片雲間師在有無外我嬰塵土間居然本相别不要慘離顔此詩邑乘失載余渭陽豈庵先生嘗拈山居第四絶云無鄰無里不成村水曲雲重掩石門何用深求避秦客吾家便是五陵源懸之座右日夕歌之且笑南陽劉子驥多事可稱詩林嘉話晉又識唐書本傳吳融字子華越州山隂人祖翥有名大中時觀察使召以署吏不應帥高其槩言諸朝賜號文簡先生融學自力富辭調龍紀初及進士第韋昭度討蜀表掌書記遷纍侍御史坐纍去官流浪荆南依成汭久之召為左補闕以禮部郎中為翰林學士拜中書舍人昭宗反正御南闕羣臣稱賀融最先至于時左右歡駭帝有指授疊十許稿融跪作詔少選成語當意詳帝咨賞良厚進户部侍郎鳳翔劫遷不克從去客閿鄉俄召還翰林遷承旨卒官
