body:
  text: 唐英歌詩卷下唐吳融撰武闗時來時去若循環雙闔平雲澷鏁山祗道地教秦設險不知天與漢為闗貪生莫作千年計到了都成一夢閒爭得便如巖下水從他興廢自潺潺月夕追事曽聼豪家碧玉歌雲牀氷簟落秋河月臨高閣簾無影風過迴廊幕有波屈指盡隨雲雨散滿頭贏得雪霜多此時空見清凉影來伴蛩聲咽砌莎送于員外歸隱藍田曽吟工部兩峰寒今日星郎得挂冠吾道不行歸始是世情如此住應難圍棊已訪生雲石把釣先尋急浪一作雨湍若遇秦時雪髯客紫芝兼可備朝餐廢宅風飄碧瓦雨摧垣却有鄰人為鏁門幾樹好花閒白晝滿庭荒草易黄昏放魚池涸蛙爭聚栖燕梁空雀自喧不獨凄凉眼前事咸陽一火便成原湖州晚望鼓角迎秋晚韻長斷虹疎雨間微陽兩條溪水分頭碧四面人家入骨凉獨鳥歸時雲鬭迥殘蟬急處日爭忙他年若得壺中術一簇汀洲盡貯将上陽宫辭苑路青青半是苔翠華西去未知迴景陽春漏無人報太液秋波有鴈來單影可堪明月照紅顔無奈落花催誰能賦得長門事不惜千金奉酒杯宋玉宅草白煙寒半野陂臨江舊宅指遺基已懐湘浦招魂事更憶髙唐説夢時穿徑早曽聞客住登牆豈復見人窺今朝送别還經此吟斷當年雲夢悲春晚書懐落盡紅芳春意闌緑蕪空鏁辟疆園嫦娥斷影霜輪冷帝子無踪淚竹繁未逹東林還絶想不勞南浦更銷魂晚來雖共殘鶯約爭奈風凄雨又昏寄楊侍郎雲情鶴態莫誇慵正上仙樓十二重吟逸易沉一作成鳷鵲月夢長先斷景陽鐘奇文已刻金書劵秘語看䥴玉檢封何事春來待歸隱探知溪畔有風松杏花粉薄紅輕掩歛羞花中占斷得風流軟非因醉都無力凝不成歌亦自愁獨照影時臨水畔最含情處出牆頭徘徊盡日難成别更待黄昏對酒甌憲丞裴公上洛退居有寄二首鴻在㝠㝠已自由紫芝峰下更髙秋抛來簮紱都如夢泥著杯觴不為愁晚樹拂簷風脱翠夜灘當户月和流自嗟不得從公去共上仙家十二樓瘦如仙鶴爽風篁外却塵囂興緒長偶坐幾囘沉皓月閒吟是處到殘陽門前立使修書嬾花下留賔壓酒忙目斷瓊林攀不得一重丹水抵三湘叢祠叢祠一炬照秦川雨散雲飛二十年長路未歸萍逐水舊居難問草平烟金鞍正伴桐鄉客粉壁猶懐桂苑仙何必向來曽識面拂塵看字也凄然分水嶺兩派潺湲不暫停嶺頭長㵼别離情南隨去馬通巴棧北逐歸人逹渭城澄處好窺雙黛影咽時堪寄斷腸聲紫溪舊隱還如此清夜梁山月更明赴職西川過便橋書懐寄同年平門橋下水東馳萬里從軍一望時鄉思旋生芳草見客愁何限夕陽知秦陵無樹烟猶鏁漢苑空牆浪欲吹不見一作是傷春愛囘首杏壇恩重馬遲遲太保中書令軍前新樓十二欄杆壓錦城半空人語落灘聲風流近接平津閣氣色髙含細栁營盡日捲簾江草緑有時欹枕雪峰晴不知捧詔朝天後誰此登臨看月明玉女廟九清何日降仙霓掩映荒祠路欲迷愁黛不開山淺淺離心長在草萋萋簷横緑𣲖王餘擲牕裊紅枝杜宇啼若得洗頭盆置此靚粧無復碧蓮西坤維軍前寄江南弟兄二年征戰劍山秋家在松江白浪頭闗月幾時乾客淚戍烟終日起鄉愁未知遼堞何當下轉覺燕䑓不易酬獨羡一聲南去鴈滿天風雨到汀洲滻水席上獻座主侍郎暖泉宫裏告䖍回畧避紅塵小宴開落絮已隨流水去啼鶯逺傍夕陽來草能縁岸侵羅薦花不容枝蘸玉盃莫訝諸生中獨醉感恩傷别正難裁送知古上人昔年離别浙河東多難相逢舊楚宫振錫纔尋三徑草登船忽挂一㠶風幾程村飯添盂白何處山花照衲紅不似投荒憔悴客滄浪無際問漁翁和座主尚書登布善寺樓往事何時不繫腸更堪凝睇白雲鄉楚王城壘空秋色羊祜江山秖瞑光林下逺分南去馬渡頭偏認北歸航誰知此日憑軒處一筆工夫勝十一作七襄金橋感事太行和雪疊晴空二月春郊尚朔風飲馬早聞臨渭北射鵰今欲過山東百年徒有伊川嘆五利寧無魏綘功日暮長亭正愁絶哀笳一曲戍烟中蕭縣道中戌火三籠滯晚程枯桑繫馬上寒城滿川落照無人過卷地飛蓬有燒明楚客早聞歌鳳徳劉琨休更舞雞聲草堂舊隱終歸去寄語巖猿莫暁驚兖州泗河中石牀李白杜甫皆此飲詠一片苔牀水潄痕何人清賞動乾坤謫仙醉後雲為態野客吟時月作魂光景不迴波自逺風流莫一作難問石無言邇來多少登臨客千載誰將勝事論禁直偶書玉皇新復五城居仙館詞臣在碧虚釦一作錦砌漸看翻芍藥鏁牕還詠隔一作碧蟾蜍敢期林上靈烏語貪草雲間彩鳳書爭奈滄洲頻入夢白波無際落紅蕖送弟東歸偶持麟筆侍金閨夢想三年在故溪祖竹定欺簷雪折稚杉應拂棟雲齊謾勞筋骨趨丹鳳可有文詞詠碧雞此别更無閒事囑北山髙處謝猿啼和座主尚書春日郊居海燕初歸朔雁回靜眠深掩百花臺春蔬已為髙僧掇臘醖還因熟客開簷外暖絲兼絮墮檻前輕浪帶鷗來謝公難避蒼生意自古風流必上台僧舍白牡丹二首膩若裁雲薄綴霜春殘獨自殿羣芳梅粧向日霏霏暖紈扇揺風閃閃光月魄照來空見影露華凝後更多香天生潔白宜清凈何必殷紅映洞房侯家萬朶簇霞丹若並雙林素艷難合影只應天際月分香多是畹中蘭雖饒百卉爭先發還在三春向後殘想得惠林憑此檻肯将榮落意來看八月十五夜禁直寄同僚中秋月滿盡相尋獨入非烟宿禁林曽恨人間千里隔更堪天上九門深明涵太液魚龍定靜鏁圎靈象緯沉目斷枚臯何處在欄干十二憶登臨上已日花下閒看十里香塵撲馬飛碧蓮峰下踏青時雲環照水和花重羅袖擡風惹絮遅可便無心邀窈一作娬媚還應有淚憶袁熈如烟如夢爭尋得溪桞回頭萬萬絲禪院奕棊偶題裛塵絲雨送㣲凉偶出樊籠入道塲半偈已能消萬事一枰兼得了殘陽尋知世界都如夢自喜身心甚不忙更約西風揺落後醉來終日卧禪房和張舍人玉女盆邉雪未銷正多春事莫無憀杏花向日紅勻臉雲帶環山白繫腰鶯囀樹頭欹枕聽凍開泉眼杖藜挑陵遷谷變如須問控鶴山人字子喬送友赴闕故人歸去指翔鸞樂帶離聲可有歡驛路兩行秋吹急渭波千疊夕陽寒空郊已嘆周禾熟舊苑應尋漢火殘遥羡從公無一事探花先醉曲江干文德初聞車駕東遊龍斾叢叢下劍門還将瑞氣入中原鼇頭一蕩山雖沒烏足重安日不昏晉客已知周禮在秦人仍喜漢官存自憐閒坐漁磯石萬級雲臺落夢魂子規舉國繁華委逝川羽毛飄蕩一年年他山呌處花成血舊苑春來草似烟雨暗不離濃綠樹月斜長弔欲明天湘江日暮聲凄切愁殺行人歸去船簡州歸降賀京兆公分棟山前曙色開三千鐡騎簡州回雲間墮箭飛書去風裏擎竿露布來古謂伐謀為上策今朝静勝自中台功名一似淮西事只是元臣不姓裴登漢州城樓雨餘秋色拂孤城遠日凝時萬象新疊翠北來千嶂盡漫流東去一江平從軍固有荆州樂懐古能無峴首情欲下闌干一回首鳥歸帆沒戍煙生一作明過鄧城縣作不用登臨足感傷古來今往盡茫茫未知堯桀誰臧否可便彭殤有短長楚壘萬重多故事漢波千疉更殘陽到頭一切皆身外只覺閒一作闗身是醉鄉岐下寓居見槐花落因寄從事纔開便落不勝黄覆著庭莎襯夕陽只共蟬催雙髩老可知人已十年忙暁牕須為吟秋興夜枕應敎夢帝鄉蜀國馬卿看從獵肯将閒事入凄凉和人有感莫愁家住石城西月墜星沉客到迷一院無人春寂寂九原何處草萋萋香魂不散烟籠水舞袖休翻桞拂堤蘭棹一移風雨急流鶯千萬莫長啼春歸次金陵春隂漠漠覆江城南國歸橈趂晩程水上驛流初過雨樹籠堤去一作處不離鶯跡踈冠蓋兼無夢地近郷園自有情更被東風動離思楊花千里雪中行一作更被東風致愁絶途中見杏花一枝紅杏出牆頭牆外人行正獨愁長得看来猶有恨可堪逄處更難畱林空色曙鶯先到春淺香寒蝶未遊更憶帝鄉千萬樹澹烟籠日暗皇一作神州秋日經别墅别墅蕭條海上村偶期蘭菊與琴樽簷横碧嶂秋光近樹帶閒潮晩色昏幸有白雲眠楚客不勞芳草思王孫北山移去前文在無復教人嘆暁猿紅葉露染霜乾片片輕斜陽照處轉烘明和烟飄落九秋色隨浪汎将千里情幾夜月中藏鳥影誰家庭際伴蛩聲一時衰颯無多恨看着清風綵翦成離霅溪感事獻鄭員外足恨饒悲不自由萍無根蒂水長流庾公明月吟連曙謝守青山看入秋一飯意專堪便死千金諾在轉難酬雲沉鳥去回頭否平子才多好賦愁岐州安西門安西門外徹安西一百年前斷鼓鼙犬解人歌曽入唱馬稱龍子幾來嘶自從遼水煙塵起更到塗山道路迷今日登臨須下淚行人無箇草萋萋偶書青牛闗畔寄孤村山當屏風石當門芳樹緑隂連蔽芾長河飛浪接崑崙苔田緑後蛙爭聚麥隴黄時雀更喧只此無心便無事避人何必武陵源得京中親友書訝久無音耗以詩代謝退閒何事不忘機况限溪雲靜掩扉馬頰浪髙魚去少鷄鳴闗險雁來稀無才敢更期連茹有意兼思學採薇珍重故人知我者九霄休復寄音徽即事抵鵲山前雲掩扉便甘終老脫朝衣暁窺清鏡千峰入暮倚長松獨鶴歸雲裏引來泉脉細雨中移得藥苗肥何須一筯鱸魚膾始挂孤㠶問釣磯病中宜茯苓寄李諫議千年伏莬帶龍鱗太華峰頭得最珍金鼎暁煎雲漾粉玉甌寒貯露含津南宫已借徵詩客杜工部有寄楊員外茯苓之什内署今還託諫臣飛檄愈風知妙手也須分藥救漳濱闗西驛亭即事晚霞零落雨初收闗上危欄悵獨畱千里好春聊極目五陵無事莫回頭山猶帶雪霏霏恨桞未禁寒冉冉愁直是無情也腸斷鳥歸帆沒水空流望嵩山三十六峰危似冠晴樓百尺獨登看髙凌鳥外青冥窄翠落人間白晝寒不覺衡陽遮雁過如何鍾阜對龍盤始知萬嵗聲長在只待東巡動玉鸞題湖城縣西道中槐樹零落欹斜此路中盛時曽識太平風暁迷天仗歸春苑暮送鸞旗指洛宫一自煙塵生薊北更無消息幸闗東而今只有孤根在鳥啄蟲穿沒亂蓬東歸次瀛上暖烟輕淡草霏霏一片晴山襯夕暉水露淺沙無客泛樹連疎苑有鶯飛自從身與滄浪别却被春敎寂寞歸回首青門不知處向人楊桞自一作莫依依槎浪㾗龍跡老欹危流落何時别故枝嵗月空教苔蘚積芳菲長倩薜蘿知有文在朽人難識無蠧藏心鳥莫窺家近滄浪從汎去碧天消息不參差汴上觀九曲河氷半叚來嚴霜結出勁風裁非時已認蟬飄翼到海須憂蚌失胎千里夜清聞戛玉幾人東下憶奔雷殷勤莫礙星槎路從看天津弄杼回閒居有作依依芳樹一作草拂簷平繞竹清流侵骨清愛弄緑苔魚自躍慣偷紅果鳥無聲踏青堤上烟多緑拾翠江邉月更明只此超然長往是幾人能遂鑄金成一作城離岐下題西湖送夏迎秋幾醉來不堪行色被蟬催身隨渭水看歸逺夢挂秦雲約自回雨細若為抛釣艇月明誰復上歌臺千波萬浪西風急更為紅蕖把一杯岐陽䝉相國借宅因抒懐投獻風有危亭月有臺平津閣畔好徘徊雖非宋玉誅茅至且學王家種竹來已得静居從馬歇不堪行色被蟬催故園蘭菊三千里旅夢方應校懶回晚泊松江落日停橈古渡邉古今踪跡一蒼然平沙盡處雲藏樹逺吹收來水定天正困東西千里路可憐瀟洒五湖船如何不及前賢事却謝鱸魚在洛川過澠池書事澠池城郭半遺基無限春愁挂落暉桞渡風輕花浪緑麥田烟暖錦雞飛相如忠烈千秋斷二主英雄一夢歸莫道新亭人對泣異鄉殊代也霑衣富春水送山迎入富春一川如畫晩晴新雲低逺渡帆來重潮落寒沙鳥下頻未必桞間無謝客也應花裏有秦人嚴光萬古清風在不敢停橈更問津髙侍御話及皮博士池中白蓮因成一章寄博士兼呈侍御白玉花開緑錦池風流御史報人知看來應是雲中墮偷去須從月下移已被亂蟬催婉娩更禁凉雨動䙰褷習家秋色堪圖畫只欠山公倒接䍦憶猿翠㣲雲歛日沉空呌徹青㝠怨不竆連臂影垂溪色裏斷腸聲盡月明中靜舎烟峽凄凄雨髙弄霜天嫋嫋風猶有北山歸意在少驚佳樹近房櫳紅樹一聲南雁已先紅神女霜飛葉葉同自是孤根非暖地莫驚他木耐秋風暖烟散去隂全薄明月臨來影半空長憶洞庭千萬樹照山横浦夕陽中新鴈湘浦深春始北歸玉闗揺落又南飛數聲飄去和秋色一字横來背晚暉紫閣髙鳴雲羃羃灞陵晚渡雨㣲㣲莫從思婦臺邉過未得征人塞外書一作萬里衣海上秋懐辭無珪組隱無才門向潮頭過處開幾度黄昏逢罔象有時紅旭見蓬萊磧連荒戌頻頻火天絶纎雲徃徃雷昨夜西風已揺落那堪更上望鄉臺憶山泉穿雲落日細湔湔盡日疑聞弄管絃千仞灑来寒碎玉一泓深去碧涵天烟迷葉亂尋難見月好風清聽不眠春雨正多歸未得只應流恨更潺湲東歸望華山碧蓮重疉在青㝠落日垂鞭緩客程不奈春煙籠暗澹可堪秋雨洗分明南邉已放三千馬北面猶標百二城只怕仙人撫髙掌年年相見是空行遊華州飛泉亭走馬街南百畆池碧蓮花影倒參差偶同人去紅塵外正值僧歸落照時萬事已為春棄置百憂須賴酒醫治殷勤待取前峰月更倚欄干弄釣絲葉落紅影飄來翠影㣲一辭林表不知歸伴愁無色煙猶在替恨成啼露未稀若逐水流應萬里莫因風起便孤飛楚郊千樹秋聲急日暮紛紛惹客衣池上雙鳬二首碧池悠漾小鳬雛兩兩依依祗自娯釣艇忍移人散去寒鴟有意即相呼可憐翡翠歸雲髻莫羡鴛鴦入畫圖幸是羽毛無取處一生安穏老菰蒲雙鳬狎得傍池臺戲藻銜蒲逺又回敢為稻粱凌險去幸無鷹隼觸波來萬絲春雨眠時亂一片濃萍浴處開不在籠欄夜仍好月汀星沼剰徘徊和皮博士赴上京觀中修靈齋贈威儀尊師兼見寄霓結雙旌羽綴裙七星壇上拜元君精誠有為天應感章奏無私鬼怕聞鶴馭已隨烟際下鳳膏還向月中焚漢武燒鳳膏為燭以祀神壇白雲鄉路看看到好駐流年翊聖文春雨霏霏漠漠暗和春羃翠凝紅色更新寒入膩裘濃暁睡細隨油壁靜香塵連雲似織休迷雁帶桞如啼好贈人别有空階寂寥事緑苔狼籍落花頻秋池冷涵秋影碧溶溶一片澄明見底空有日晴來雲襯白幾時吹落葉浮紅香啼蓼穂娟娟露乾動蓮莖淅淅風凌暁無端照衰髮便悲霜雪鏡光中太湖石歌洞庭山下湖波碧波中萬古生幽石鐡索千尋取得來竒形怪状誰能識初疑朝家正人立又如戰士方狙擊又如防風死後骨又如於菟活時額又如成人楓又如害癭柏雨過上停泓風來中有隙想得沉潛水府時興雲出雨蟠蛟螭今來硉矹林庭上長恐忽然生白浪用時應不稱媧皇将去也堪隨博望噫嘻爾石好憑依幸有方池并釣磯小山叢桂且為伴鍾阜白雲長自歸何必豪家甲第裏玉闌干畔争光輝一朝荆棘忽流落何異綺羅雲雨飛贈方干處士歌把筆盡為詩何人敵夫子句滿天下口名聒天下耳不識朝不識市曠逍遥閒徙倚一杯酒無萬事一葉舟無千里衣裳白雲坐卧流水霜落風髙忽相憶惠然見過留一夕一夕聽吟十數篇水榭林蘿為岑寂拂旦舍我亦不辭攜笻徑去隨所適隨所適無處覔雲半片鶴一隻李周彈筝歌淮南韋太尉席上贈古人云絲不如竹竹不如肉乃知此語未必然李周彈筝聼不足聞君七嵗八嵗時五音六律皆生知就中十三絃最妙應宫出入年方少青驄慣走長楸日幾度承恩䝉急召一字鴈行斜御筵鏘金戛羽凌非烟始似五更初殘月裏凄凄切切清露蟬又如盤石罅堆葉下泠泠瀝瀝蒼崖泉鴻門玉斗初向地織女金梭飛上天有時上苑䌓花發有時太液秋波濶當頭獨坐縱一聲滿坐好風生拂拂天顔開聖心悦紫金白珠霑賜物出來無暇更還家且上青樓醉明月年將六十藝轉精自寫梨園新曲聲近來一事還惆悵故里春荒烟草平供奉且聴語自昔興衰看樂府祗如伊州與梁州盡是太平時歌舞旦夕君王繼此聲不要停絃淚如雨贈􅈯光上人草書歌篆書朴𨽻書俗草聖貴在無覊束江南有僧名􅈯光紫毫一管能顛狂人家好壁試揮拂瞬目已留三五行摘如鈎挑如撥斜如掌迴如斡又如夏禹鎖淮神波底出來手正拔又如朱亥鎚晉鄙袖中擡起腕欲脱有時軟縈盈一穗秋雲曳空濶有時瘦巉巗百尺枯松露槎枿忽然飛動更驚人一聲霹靂龍蛇活稽山賀老昔所傳又聞能者唯張顛上人致功應不可一作下其奈飄飄滄海邊可中一人天子國絡素裁縑毫洒墨不繫知之與不知須言一字千金直贈李長史歌并序余客武康縣既旬日將去邑長相餞於溪亭座中有李長史袖出蘆管自請聲以送客且言我業此二十年年少時五陵豪俠無不與之遊梨園新聲一聞之明日皆出我下洎巢賊腥穢宫闕逃難於東江淮間非吾土又無知音弊衣旅食雙髩雪然然風月好時或亭皋送别必引滿自勸不能忘情一曲未終泫然承睫越鳥朔馬之慼感動傍人羅進士隠初遇金陵有贈詩尚能成誦在口余憫李之流落仰羅之所感故贈之時光啟戊申嵗清明月之八日危欄壓溪溪澹碧翠褭紅飄鶯寂寂此日長亭愴别離座中忽遇吹蘆客雙攘輕袖當髙軒含商吐羽凌非烟初疑一百尺瀑布八九月落香爐巔又似鮫人為客罷迸涙如珠玉盤瀉碧珊瑚碎梓澤中金銀鐺撼龜山下鏗鍧揭調初驚人幽咽細聲還感神紫鳳將雛呌山月𤣥猿喪子啼江春咨嗟長史出人藝如何值此艱難際可中長似承平基肯將此為閒人吹不是東城射雉處即應南苑鬭雞時白櫻桃熟每先賞紅芍藥開長有詩賣珠曽被武皇問薰香不怕賈公知今來流落一何苦江南江北九寒暑翠華猶在橐泉中一曲梁州淚如雨長史長史聽我語從來藝絶多失所羅君贈君兩首詩半是悲君半自悲贈廣利大師歌化人之心固甚難自化其心更不易化人可以程限之自化元須有其志在心為志者何人今日得之於廣利三十年前識師初正見把筆學草書崩雲落日千萬状隨手變化生空虚海北天南幾迴别毎見書踪轉竒絶近來兼解作歌詩言語明快有氣骨堅如百鍊鋼挺特不可屈又如千里馬脱韁飛滅沒好是不雕刻縦横衝口發昨來示我十餘篇詠殺江南風與月乃知性是天習是人莫輕河邉羖䍽飛作天上麒麟但日新又日新李太白非通神古别離雜言紫鸞黄鵠雖别離一舉千里何難追猶聞啼風與呌月流連斷續令人悲賦情更有深繾綣碧甃千尋尚為淺蟾蜍正向清夜流蛺蝶須教墮絲罥莫道斷絲不可續丹穴鳯凰膠不逺莫道流水不迴波海上兩潮長日返風雨吟風騷騷雨涔涔長洲苑外荒居深門外流水流澶澷河邉古木鳴蕭森夐無禽影寂無人音端然拖愁坐萬感叢於心姑蘇碧瓦十萬户中有樓臺與歌舞尋常倚月復眠花莫説斜風兼細雨應不知天地造化是何物亦不知榮辱是何主吾囷長滿是太平吾樂不極是天生豈憂天下有大憝四郊刁斗長錚錚官軍擾人甚於賊将臣怕死唯守城又豈復憂朝廷苦弛慢中官轉縱横李膺勾黨即羅患竇武忠謀又未行又豈憂文臣盡遭束髙閣文教從今日蕭索若更無人稍近前把筆到頭同一惡可歎吳城城中人無人與我交一言蓬蒿滿徑塵一榻獨此閔閔何其煩雖然小或可謀大􅄔婦之憂史尚存况我長懐丈夫志今來流落滄溟涘有時驚事再咨嗟因風因雨更憔悴只有閒横膝上琴怨傷怨恨聊相寄伯牙海上感滄溟何似今朝風雨思首陽山首陽山枕黄河水上有兩人曽餓死不同天下人為非兄弟相看自為是遂令萬古識君心為臣貴義不貴身精靈長在白雲裏應笑隨時飽死人江行來時風去時雨蕭蕭颯颯春江浦欹欹側側海門㠶軋軋啞啞洞庭櫓壁畫折竹雜言枯纒藤重欹雪渭曲逢湘江别不是從來無本根畫工取勢教摧折古錦裾六韻錦上有鸚鵡鶴陸處士有序濯水經何日隨風故有人緑衣猶偪畫丹頂尚迷真暗澹雲沉古青蒼蘚剥新映襟如惹淚侵韉想縈塵掣曳無由覩流傳久自珍武威應認得牽挽幾當春賦得欲暁看粧面朧朧欲曙色隱隱辨殘粧日始雲中出花猶霧裏藏睂邊全失翠額畔半畱黄轉入金屏影隈侵角枕光有蟬隳髩樣無燕着釵行十二峰前夢如何不斷腸府試賦得雨夜帝里聞猿聲雨滴秦中夜猿聞峽外聲已吟何遜恨還賦屈平情暗逐哀聲一作鴻切遥含禁漏清直疑逰萬里不覺在重城霎霎侵燈亂啾啾入夢驚明朝臨曉鏡别有鬢絲生題畫柏不得月中桂轉思陵上柏閒取畫圖看煩紆未一作果氷釋桂生在青冥萬古煙霧隔下䕃元兔窟上映嫦娥魄圓缺且不當髙低圖難測若非假羽翰折攀何由得天逺眼虚穿夜闌頭自白未如陵上柏一定不移易有意兼松茂無情從麝食不在是非間與人為憤激他年上縑素今日懸屋壁靈怪不可知風雨疑來逼明朝歸故園唯此固所適回首見團枝無勞恵消息平望蚊子二十六韻天下有蚊子候夜噆人膚平望有蚊子白晝來相屠不避風與雨羣飛出菰蒲擾擾蔽天黒雷然隨舳艫利嘴入人肉㣲形紅且濡振蓬亦不懼至死貪膏腴舟人敢停棹陸者亦疾趨南北百餘里畏之如虎驅噫嘻天地間萬物各有殊陽者陽為伍隂者隂為徒蚊蚋是尤一作隂物夜從喧牆隅如何正曦赫吞噬當通衢人筋為爾斷人力為爾枯衣巾穢且甚盤饌腥有餘豈是陽德衰不能使消除豈是有主者此鄉宜毒荼吾聞蛇能螫避之則無虞吾聞蠆有毒見之可疾趨唯是此蚊子逢人皆病諸江南夏景好水木多蕭疎此中震澤路風月彌清虚前後幾來徃襟懐曾未舒朝既䝉襞積夜仍跧蘧除雖然好吟嘯其奈難踟蹰人生有不便天意當何如誰能假羽翼直上言紅鑪桃花滿樹如嬌爛漫紅萬枝丹彩灼春融何當結作千年實将示人間造化工木筆花嫩如新竹管初齊粉膩紅輕樣可携誰與詩人偎檻看好於牋墨併分題唐英歌詩巻下
